[project]
name = "pyadql"
readme = "README.md"
description = "pyadql turns an ADQL query into an AST"
authors = [{name="Jean-Christophe Malapert", email="jean-christophe.malapert@cnes.fr"}, ]
license = "Apache-2.0"
packages = [{include = "pyadql"}]
homepage = "https://gitlab.cnes.fr/pdssp/common/pyadql"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "lark>1.3,<2.0",
    "loguru>=0.7.3",
]
[project.scripts]
pyadql = "pyadql.__main__:run"

# ── Build ────────────────────────────────────────────────────────────────────
[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyadql"]

# ── Dev dependencies ─────────────────────────────────────────────────────────
[dependency-groups]
dev = [
    "dockerfile-parse>=2.0.1",
    "bump-my-version>=1.2.4",
    "coverage>=7.12.0",
    "mkdocs>=1.6.1",
    "mkdocs-gen-files>=0.6.0",
    "mkdocs-literate-nav>=0.6.2",
    "mkdocs-macros-plugin>=1.5.0",
    "mkdocs-material>=9.7.0",
    "mkdocs-with-pdf>=0.9.3",
    "mkdocstrings[python]>=1.0.0",
    "pip-licenses>=5.5.0",
    "pre-commit>=4.5.0",
    "pre-commit-hooks>=6.0.0",
    "pytest>=9.0.1",
    "pytest-html>=4.1.1",
    "pytest-json-report>=1.5.0",
    "pytest-profiling>=1.8.1",
    "docker>=7.1.0",
    "pytest-mock>=3.15.1",
    "black>=25.11.0",
    "tox>=4.32.0",
    "flake8>=7.3.0",
    "mccabe>=0.7.0",
    "mypy>=1.19.0",
    "pylint>=4.0.4",
    "toml>=0.10.2",
]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | docs
  | scripts
  | docker
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.bandit]
exclude_dirs = [".venv", "tests", "scripts"]
